<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Draft Night</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            font-size: 14px;
            letter-spacing: 4px;
            color: #8fa6bf;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #a8b6c7;
            font-size: 19px;
            margin-bottom: 50px;
        }

        .draft-card {
            background: #101d2e;
            border: 1px solid #263b52;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .round {
            color: #5ee28a;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .clock {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .instruction {
            color: #9baabd;
            margin-bottom: 30px;
        }

        button {
            background: #5ee28a;
            color: #07111f;
            border: none;
            border-radius: 8px;
            padding: 15px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7cf09f;
        }

        .players {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 35px;
        }

        .player {
            flex: 1;
            max-width: 200px;
            padding: 18px;
            border-radius: 10px;
            background: #0c1725;
            border: 1px solid #263b52;
        }

        .status {
            color: #5ee28a;
            font-size: 12px;
            margin-top: 8px;
        }

        footer {
            margin-top: 40px;
            color: #53677d;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 38px;
            }

            .players {
                flex-direction: column;
                align-items: center;
            }

            .player {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            FOOTBALL INTELLIGENCE DRAFT
        </div>

        <h1>Draft Night</h1>

        <p class="subtitle">
            Three managers. One prediction board. No duplicate picks.
        </p>

        <div class="draft-card">

            <div class="round">
                DRAFT LOBBY
            </div>

            <div class="clock">
                Waiting for Managers
            </div>

            <p class="instruction">
                The draft will begin when all three GMs are ready.
            </p>

            <button>
                ENTER WAR ROOM
            </button>

            <div class="players">

                <div class="player">
                    <strong>GM 1</strong>
                    <div class="status">● READY</div>
                </div>

                <div class="player">
                    <strong>GM 2</strong>
                    <div class="status">● READY</div>
                </div>

                <div class="player">
                    <strong>GM 3</strong>
                    <div class="status">● READY</div>
                </div>

            </div>

        </div>

        <footer>
            Football Draft Night • Commissioner Edition
        </footer>

    </div>

</body>

</html>
